# Canon Camera Auto-Sync — Configuration
# Copy this file to config.yml and edit the values for your setup.

# Absolute path where downloaded photos will be saved.
# Photos are organized into YYYY/MM/ subfolders by capture date.
dest_base: /path/to/your/photo/destination

# Linux user and group that will own the downloaded files.
# The sync script runs as root (required for USB access), then
# chowns all files to this user/group after download.
owner_user: your_username
owner_group: your_username

# USB vendor ID from lsusb.
# Canon = 04a9 (same for all Canon cameras)
# Other brands: Nikon = 04b0, Sony = 054c, Fujifilm = 04cb
camera_vendor_id: "04a9"

# USB product ID from lsusb — specific to your camera model.
# To find yours: plug in camera, run: lsusb | grep -i canon
# Example output: Bus 001 Device 015: ID 04a9:32f9 Canon, Inc.
#                                           ^^^^
# Common Canon product IDs:
#   32f9 = Canon EOS M50 Mark II
#   32d2 = Canon EOS R
#   32da = Canon EOS RP
#   32e2 = Canon EOS R5
#   32e4 = Canon EOS R6
camera_product_id: "32f9"

# Camera brand name used by gphoto2 --auto-detect to verify
# the camera is connected. Case-insensitive.
camera_detect_name: canon

# Directory where install.sh will copy the sync script and config.
# This is where the script runs from after installation.
script_dir: /opt/canon-camera-sync

# Seconds to wait after USB connect before syncing.
# Gives the camera time to fully initialize over USB.
# Increase if you get detection failures on slow machines.
pre_delay_seconds: 5

# ─── Transport ────────────────────────────────────────────────────────────────
# How to reach the camera:
#   auto  — USB when the camera is plugged in, otherwise Wi-Fi (default)
#   usb   — USB only, never fall back to the network
#   ccapi — network only, even if the camera is also plugged in
#
# Omit this key and you get "auto". Nothing needs changing when you switch
# between cable and Wi-Fi: plug in and USB wins, unplug and Wi-Fi takes over.
# USB is preferred because it is faster and needs no camera-side setup.
transport: auto

# The camera's Wi-Fi MAC address, used to find it on the network. The IP is
# resolved from the ARP table at run time, so the camera can stay on DHCP with
# no router reservation. Find it on the camera under
# MENU > Wi-Fi settings > MAC address. Dashes or colons both work.
#
# Leave empty and the Wi-Fi path is skipped entirely, so "auto" behaves
# exactly like "usb".
#
# Wireless transfer uses Canon's CCAPI, which must be activated once over USB —
# see the "Wi-Fi transfer (CCAPI)" section of README.md before setting this.
camera_mac: ""

# The port CCAPI listens on. 8080 is the camera default; its menu shows the
# value as 08080, under Camera Control API > Port No.
ccapi_port: 8080

# Only needed if you registered an account on the camera under
# Camera Control API > Account settings. With no account registered, CCAPI is
# open on your LAN and these stay empty.
ccapi_user: ""
ccapi_password: ""
