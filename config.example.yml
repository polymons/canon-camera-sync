# Canon Camera Auto-Sync — Configuration
# Copy this file to config.yml and edit the values for your setup.

# Absolute path where downloaded photos will be saved.
# Photos are organized into YYYY/MM/ subfolders by capture date.
dest_base: /path/to/your/photo/destination

# Linux user and group that will own the downloaded files.
# The sync script runs as root (required for USB access), then
# chowns all files to this user/group after download.
owner_user: your_username
owner_group: your_username

# USB vendor ID from lsusb.
# Canon = 04a9 (same for all Canon cameras)
# Other brands: Nikon = 04b0, Sony = 054c, Fujifilm = 04cb
camera_vendor_id: "04a9"

# USB product ID from lsusb — specific to your camera model.
# To find yours: plug in camera, run: lsusb | grep -i canon
# Example output: Bus 001 Device 015: ID 04a9:32f9 Canon, Inc.
#                                           ^^^^
# Common Canon product IDs:
#   32f9 = Canon EOS M50 Mark II
#   32d2 = Canon EOS R
#   32da = Canon EOS RP
#   32e2 = Canon EOS R5
#   32e4 = Canon EOS R6
camera_product_id: "32f9"

# Camera brand name used by gphoto2 --auto-detect to verify
# the camera is connected. Case-insensitive.
camera_detect_name: canon

# Directory where install.sh will copy the sync script and config.
# This is where the script runs from after installation.
script_dir: /opt/canon-camera-sync

# Seconds to wait after USB connect before syncing.
# Gives the camera time to fully initialize over USB.
# Increase if you get detection failures on slow machines.
pre_delay_seconds: 5

# ─── Transport ────────────────────────────────────────────────────────────────
# How to reach the camera:
#   auto  — USB when the camera is plugged in, otherwise Wi-Fi (default)
#   usb   — USB only, never fall back to the network
#   ccapi — network only, even if the camera is also plugged in
#
# Omit this key and you get "auto". Nothing needs changing when you switch
# between cable and Wi-Fi: plug in and USB wins, unplug and Wi-Fi takes over.
# USB is preferred because it is faster and needs no camera-side setup.
transport: auto

# The camera's Wi-Fi MAC address, used to find it on the network. The IP is
# resolved from the ARP table at run time, so the camera can stay on DHCP with
# no router reservation. Find it on the camera under
# MENU > Wi-Fi settings > MAC address. Dashes or colons both work.
#
# Leave empty and the Wi-Fi path is skipped entirely, so "auto" behaves
# exactly like "usb".
#
# Wireless transfer uses Canon's CCAPI, which must be activated once over USB —
# see the "Wi-Fi transfer (CCAPI)" section of README.md before setting this.
camera_mac: ""

# The port CCAPI listens on. 8080 is the camera default; its menu shows the
# value as 08080, under Camera Control API > Port No.
ccapi_port: 8080

# Only needed if you registered an account on the camera under
# Camera Control API > Account settings. With no account registered, CCAPI is
# open on your LAN and these stay empty.
ccapi_user: ""
ccapi_password: ""

# ─── Geotag review ────────────────────────────────────────────────────────────
# The camera has no GPS receiver: it gets location from the phone over Bluetooth,
# and that link is often down when the shutter fires. The coordinates can be
# merged onto the card afterwards — sometimes long after this archive already
# holds the file. A normal sync never notices, because it only ever looks at
# files that are *missing* locally.
#
# The geotag review closes that gap. It runs at the end of an ordinary sync, so
# every event that already starts one — a cable going in, the camera announcing
# itself on Wi-Fi, the safety-net timer — also asks whether the card has since
# gained coordinates for files already in the archive.
#
#   auto   run when the ledger says there is something worth looking at
#   off    never run (the manual CAMERA_SYNC_REFRESH path still works)
#   force  run on every event, ignoring geo_min_interval_seconds
#
# See the "Geotag review" section of README.md before changing anything below.
geo_review: auto

# How much one event may spend on the expensive tier — actually reading card
# files. Split by transport because the two events mean different things: a
# cable being plugged in is deliberate and runs at ~10 MB/s, while a Wi-Fi
# announcement is incidental and the camera may be switched off again in a
# minute. Whichever limit is reached first stops the pass; the next event
# resumes from where it left off.
geo_budget_files_usb: 150
geo_budget_seconds_usb: 900
geo_budget_files_ccapi: 400
geo_budget_seconds_ccapi: 300

# Used only when the camera turns out not to serve HTTP Range. With Range a
# coordinate check costs 256 KiB; without it, a whole file — so the budget has
# to fall by two orders of magnitude to cost the same.
geo_budget_files_ccapi_full: 20

# Whether this camera ever adds coordinates to a card file after capture is an
# empirical question, and most stills in a typical archive have an empty GPS
# block — so one miss proves nothing, it is just the base rate. Until something
# is actually found the review spends only geo_probe_files checks per event;
# after geo_giveup checks with no result at all it writes the premise off and
# stops spending. Both counters live in the ledger and survive between events.
geo_probe_files: 5
geo_giveup: 25

# How a written-off premise comes back, both cheap. geo_rearm_probe_files is a
# rotation of metadata-only probes over files already settled; over USB, several
# whole-KB sizes changing at once in the listing costs nothing at all and means
# something rewrote the files. `CAMERA_SYNC_GEO=rearm` forces it by hand.
geo_rearm_probe_files: 25
geo_rearm_kb_threshold: 3

# One power-on produces a burst of SSDP announcements and the camera re-announces
# every ~15 minutes, so without this a settled archive would be re-walked several
# times an hour to reach the same conclusion. Only applies when the sync found no
# new photos: a camera that has just handed over new files is always worth asking
# about the old ones.
geo_min_interval_seconds: 3600

# Firmware updates happen, so a camera that refused partial downloads once is
# asked again this often.
geo_range_recheck_days: 30

# Safety valve on the ledger. Over this many rows it is rebuilt, which costs
# budget but never data.
geo_ledger_max_rows: 20000

# Exact card-side sizes over USB come from one batched `gphoto2 --show-info`.
# Set to 0 if that output cannot be parsed on your firmware; the review then
# falls back to downloading, which is correct but much more expensive.
geo_show_info_batch: 1
